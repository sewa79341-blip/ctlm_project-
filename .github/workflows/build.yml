name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libncurses5:i386 libstdc++6:i386 libz1:i386 zlib1g-dev openjdk-17-jdk unzip wget libltdl-dev

    - name: Install Python Build Dependencies
      run: |
        pip install --upgrade pip
        pip install cython==0.30.0 buildozer

    - name: Create buildozer.spec automatically if missing
      run: |
        if [ ! -f "buildozer.spec" ]; then
          buildozer init
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
          sed -i 's/#package.name = myapp/package.name = jaanegaindia/' buildozer.spec
          sed -i 's/#package.domain = org.test/package.domain = org.jaanegaindia/' buildozer.spec
          sed -i 's/#title = My Application/title = Jaanega India Tabhi To Bachayega India/' buildozer.spec
        fi

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jaanegaindia-apk
        path: bin/*.apk
